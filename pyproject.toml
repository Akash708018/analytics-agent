[project]
name = "analytics-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "aki708018861@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastmcp>=3.4.7",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
analytics-agent = "analytics_agent:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The engine's suite. The Track B UI keeps its own tests under ui/tests, which need streamlit
# and run with `uv run --group ui pytest ui/tests`.
testpaths = ["tests"]
