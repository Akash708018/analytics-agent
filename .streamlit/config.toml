[server]
# This machine only. Streamlit's default listens on every interface, so with the real backend
# anyone on the same network could open the app, upload files and spend the .env's model quota
# (seen at startup: "Network URL: http://192.168.1.5:8501"). Hosting sets its own address.
address = "localhost"
maxUploadSize = 100
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
# No "Deploy" button or developer menu for a visitor (seen in the browser check, Step 9).
toolbarMode = "viewer"

# The portfolio's "warm data studio" tokens (akash-portfolio dist/styles.css).
[theme]
base = "light"
primaryColor = "#9d472c"
backgroundColor = "#f1e3d0"
secondaryBackgroundColor = "#fbf4e9"
textColor = "#37271f"
